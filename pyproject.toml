[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanlm"
version = "0.1.0"
description = "从 tokenizer 到 DPO 的中文 decoder-only 语言模型训练工程"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<2.9", "tokenizers>=0.21,<0.23", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
hanlm = "hanlm.cli:main"

[tool.setuptools.packages.find]
include = ["hanlm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
